######
## CMS Protection (WordPress) - nginx
######
# Nested regex locations inside a prefix location take precedence over the vhost's
# top-level "location ~ \.php$" (FastCGI), so they can deny PHP. They must never be
# empty "allow" blocks: an empty location serves the .php file as static source.

# Sensitive core files
location = /wp-config.php        { deny all; }
location = /wp-config.txt        { deny all; }
location = /wp-config-sample.php { deny all; }

# readme / license / changelog files (version disclosure)
location ~* "/(readme|license|example|legalnotice|installation|changelog)\.(txt|html|md)$" { deny all; }

# No PHP execution in upload, cache and backup directories
location /wp-content/ {
    location ~* ^/wp-content/(uploads|cache|upgrade|languages|wflogs|ai1wm-backups|updraft|backups-dup-lite)/.*\.php$ { deny all; }
}

# No direct PHP in wp-includes, except the TinyMCE loader and the multisite files handler
location /wp-includes/ {
    location ~* ^/wp-includes/(?!js/tinymce/wp-tinymce\.php$|ms-files\.php$).*\.php$ { deny all; }
}
